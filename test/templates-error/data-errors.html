<b-unwrap b-name="badge">{{ label }}</b-unwrap>

<b-unwrap b-name="profile">
    <b-unwrap b-part="#badge"></b-unwrap>
</b-unwrap>

<my-card><h2>{{ title }}</h2></my-card>

<article b-name="post">
    <my-card></my-card>
</article>

<my-widget b-generate="full">{{ label }}</my-widget>

<b-unwrap b-name="host">
    <my-widget b-data:label="x"></my-widget>
</b-unwrap>
