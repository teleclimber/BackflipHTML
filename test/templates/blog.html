<b-unwrap b-name="post-list">
    <ul>
        <li b-for="post in posts">{{ post }}</li>
    </ul>
</b-unwrap>

<b-unwrap b-name="conditional">
    <p b-if="show">Shown</p>
    <p b-else>Hidden</p>
</b-unwrap>

<b-unwrap b-name="unwrap-if">
    <b-unwrap b-if="show">Visible</b-unwrap>
    <b-unwrap b-else>Fallback</b-unwrap>
</b-unwrap>

<b-unwrap b-name="unwrap-for">
    <b-unwrap b-for="item in items">{{ item }},</b-unwrap>
</b-unwrap>

<b-unwrap b-name="indexed-list">
    <ul>
        <li b-for="(post, i) in posts">{{ i + 1 }}. {{ post }}</li>
    </ul>
</b-unwrap>

<b-unwrap b-name="nested-index">
    <b-unwrap b-for="row, r in rows"><b-unwrap b-for="cell, c in row">[{{ r }}{{ c }}{{ cell }}]</b-unwrap></b-unwrap>
</b-unwrap>

<b-unwrap b-name="index-only">
    <b-unwrap b-for="_, i in widgets">{{ i }}{{ _ }},</b-unwrap>
</b-unwrap>
